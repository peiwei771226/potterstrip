<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potter's Trip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <header class="panel__head">
        <h1 id="trip-title"></h1>
        <p id="trip-subtitle"></p>
      </header>
      <nav class="days" id="days" aria-label="行程天數"></nav>
      <ol class="spots" id="spots"></ol>
    </aside>

    <main class="map">
      <div id="map" class="map__canvas"></div>
      <iframe id="map-frame" class="map__canvas" title="Google 地圖" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
      <div class="map__bar">
        <button type="button" id="locate-btn" class="btn">📍 我的即時位置</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </main>
  </div>

  <script src="itinerary.js"></script>
  <script src="app.js"></script>
</body>
</html>
