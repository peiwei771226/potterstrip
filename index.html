<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Potter's Taiwan Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <header class="masthead">
        <p class="eyebrow" id="trip-eyebrow"></p>
        <p class="trip-name" id="trip-title"></p>
        <p class="trip-sub" id="trip-subtitle"></p>
      </header>

      <nav class="days" id="days" aria-label="選擇日期"></nav>

      <section class="day" aria-live="polite">
        <div class="masthead-rule"><span></span><strong id="day-label"></strong><span></span></div>
        <h1 class="title" id="day-title"></h1>
        <p class="subtitle" id="day-subtitle"></p>
        <ul class="stats" id="stats"></ul>
        <ol class="timeline" id="stops"></ol>
        <div class="warnings" id="warnings-box">
          <h2 class="warnings-title">⚠︎ 出發前必看</h2>
          <ul id="warnings"></ul>
        </div>
      </section>

      <footer class="footer" id="trip-footer"></footer>
    </aside>

    <main class="map">
      <div id="map" class="map__canvas"></div>
      <iframe id="map-frame" class="map__canvas" title="Google 地圖" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
      <div class="map__bar">
        <button type="button" id="locate-btn" class="btn">📍 我的即時位置</button>
        <a id="open-link" class="btn btn--ghost" target="_blank" rel="noopener">在 Google 地圖開啟</a>
        <span id="status" class="status" role="status"></span>
      </div>
    </main>
  </div>

  <script src="itinerary.js"></script>
  <script src="app.js"></script>
</body>
</html>
